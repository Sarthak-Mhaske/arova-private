name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Linux Standalone Release
        run: |
          chmod +x scripts/build_arovad.sh scripts/package_app.sh
          ./scripts/package_app.sh

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arova-linux-x86_64
          path: arova-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package Windows Release
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arova-windows-x64
          path: |
            Arova-Setup-x64.exe
            arova-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package macOS Release
        run: |
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh

      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arova-macos
          path: |
            Arova-macOS.dmg
            Arova-macOS.zip

  publish-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arova-linux-x86_64
          path: release-artifacts

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arova-windows-x64
          path: release-artifacts

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arova-macos
          path: release-artifacts

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/Arova-Setup-x64.exe
            release-artifacts/arova-windows-x64.zip
            release-artifacts/Arova-macOS.dmg
            release-artifacts/Arova-macOS.zip
            release-artifacts/arova-linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
