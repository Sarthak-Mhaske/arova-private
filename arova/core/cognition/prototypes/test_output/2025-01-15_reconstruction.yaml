active_question:
  confidence: 95
  text: Why is Stripe webhook signature validation failing intermittently?
current_belief:
  confidence: 90
  text: The Flask request body was being consumed before the signature verification
    middleware could read it, causing validation to fail. Adding request.get_data(cache=True)
    fixes this by caching the body.
